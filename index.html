<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071d1a" />
    <meta name="description" content="FART, the Fabricate Awesome Review Tool: browse the CAD models, PCBs, schematics and documents in any public GitHub hardware repository." />
    <title>FART</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=nippo@400,700&display=swap" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('fart:theme') || 'null')
        if (t && t.colors) {
          for (var k in t.colors)
            if (/^--color-[a-z0-9-]+$/.test(k) && /^#[0-9a-f]{6}$/.test(t.colors[k]))
              document.documentElement.style.setProperty(k, t.colors[k])
          document.documentElement.style.colorScheme = t.scheme === 'light' ? 'light' : 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
